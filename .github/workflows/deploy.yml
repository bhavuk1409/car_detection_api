name: FastAPI Deploy (No Docker)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "🚀 Starting deployment..."

          cd ~ || exit

          echo "🧹 Freeing space..."
          sudo rm -rf car_detection_api || true
          sudo rm -rf ~/.cache/pip || true
          sudo apt clean || true
          sudo apt autoremove -y || true

          echo "📥 Cloning repo..."
          git clone https://${{ secrets.GH_TOKEN }}@github.com/bhavuk1409/car_detection_api.git
          cd car_detection_api || exit

          echo "🐍 Setting up Python..."
          sudo apt update -y
          sudo apt install -y python3-pip python3-venv

          python3 -m venv venv
          source venv/bin/activate

          echo "📦 Preparing lightweight install..."

          pip install --upgrade pip

          # 🔥 remove heavy GPU deps to prevent disk crash
          sed -i '/torch/d' requirements.txt || true
          sed -i '/ultralytics/d' requirements.txt || true

          # ✅ install CPU torch only
          pip install torch --index-url https://download.pytorch.org/whl/cpu

          # ✅ install remaining deps without cache
          pip install -r requirements.txt --no-cache-dir

          echo "🛑 Stopping old server..."
          pkill -f uvicorn || true

          echo "🚀 Starting FastAPI..."
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > log.txt 2>&1 &

          echo "📜 Last logs:"
          sleep 5
          tail -n 50 log.txt || true

          echo "✅ Deployment complete!"
