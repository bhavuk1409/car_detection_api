script: |
  echo "🚀 Starting deployment..."

  cd ~ || exit

  echo "🧹 Freeing space..."
  sudo rm -rf car-detection || true
  sudo rm -rf ~/.cache/pip || true
  sudo apt clean || true
  sudo apt autoremove -y || true

  echo "📥 Cloning fresh repo..."
  git clone https://${{ secrets.GH_TOKEN }}@github.com/bhavuk1409/car_detection_api.git car-detection
  cd car-detection || exit

  echo "🐍 Setup Python..."
  sudo apt update -y
  sudo apt install -y python3-pip python3-venv

  python3 -m venv venv
  source venv/bin/activate

  echo "📦 Installing dependencies (LIGHT MODE)..."
  pip install --upgrade pip

  # CRITICAL: install CPU torch only
  pip install torch --index-url https://download.pytorch.org/whl/cpu

  pip install -r requirements.txt --no-cache-dir

  echo "🛑 Killing old server..."
  pkill -f uvicorn || true

  echo "🚀 Starting FastAPI..."
  nohup uvicorn main:app --host 0.0.0.0 --port 8000 > log.txt 2>&1 &

  echo "✅ Deployment complete!"
