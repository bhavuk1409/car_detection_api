name: CI/CD FastAPI Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        docker build -t bhavuk1409/car-detection-api:latest .
        docker push bhavuk1409/car-detection-api:latest

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "🧹 Cleaning Docker to free space..."
          docker system prune -a -f || true
          docker volume prune -f || true

          echo "⬇️ Pulling latest image..."
          docker pull bhavuk1409/car-detection-api:latest

          echo "🛑 Stopping old container..."
          docker stop car-detection || true

          echo "🗑 Removing old container..."
          docker rm car-detection || true

          echo "🚀 Starting new container..."
          docker run -d -p 80:8000 --name car-detection bhavuk1409/car-detection-api:latest

          echo "🔍 Checking container status..."
          docker ps

          echo "📜 Container logs (last 50 lines):"
          docker logs --tail 50 car-detection

          echo "✅ Deployment finished!"
